<style>
:root{--bg:#f4f7fa;--card:#fff;--ink:#0c2233;--mut:#586b7b;--line:#dbe5ee;--acc:#2f5d62;--accfg:#fff;--sos:#d9482b;--soft:#e4eff6;--warn:#fff3df;color-scheme:light;

@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#09131b;--card:#112230;--ink:#e8f1f7;--mut:#93a8b8;--line:#223646;--acc:#8fc9c3;--accfg:#06222e;--sos:#f0694d;--soft:#143041;--warn:#33291a;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#09131b;--card:#112230;--ink:#e8f1f7;--mut:#93a8b8;--line:#223646;--acc:#8fc9c3;--accfg:#06222e;--sos:#f0694d;--soft:#143041;--warn:#33291a;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.65 system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;-webkit-text-size-adjust:100%}
main{max-width:560px;margin:0 auto;padding:20px 16px 96px}

p{margin:0 0 10px}

.hero{background:linear-gradient(155deg,#264548,#3d7478);color:#fff;border-radius:18px;padding:22px 20px;margin:12px 0 18px}.stmt{font-family:"Noto Serif KR","Nanum Myeongjo","AppleMyungjo",Georgia,serif;font-size:26px;line-height:1.45;margin:8px 0 0;font-weight:600}.lab{font-size:13px;letter-spacing:.06em;opacity:.8}
.hero h1{font-family:"Noto Serif KR","Nanum Myeongjo","AppleMyungjo",Georgia,serif;font-size:24px;margin:0 0 6px}
.hero p{margin:0;opacity:.92;font-size:15px}
.back{background:none;border:0;color:var(--acc);font-weight:700;padding:8px 0;font-size:15px}
.mind{font-family:"Noto Serif KR","Nanum Myeongjo","AppleMyungjo",Georgia,serif;font-size:22px;line-height:1.5;background:var(--soft);border-left:5px solid var(--acc);border-radius:10px;padding:16px;margin:8px 0 4px}
.box{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:10px}
.say{background:var(--card);border:1px solid var(--acc);border-radius:12px;padding:12px 14px;margin-bottom:8px;font-size:17px;font-weight:500}
ul.l{margin:0;padding-left:20px}ul.l li{margin-bottom:6px}
.tag{display:inline-block;font-size:12px;background:var(--warn);border-radius:6px;padding:1px 8px;margin-bottom:6px}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{flex:1;background:none;border:0;padding:8px 2px 10px;font-size:12px;color:var(--mut);display:flex;flex-direction:column;align-items:center;gap:3px}
nav button[aria-current="true"]{color:var(--acc);font-weight:700}
textarea{width:100%;min-height:90px;font:inherit;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:10px}
label.c{display:flex;gap:10px;align-items:flex-start;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:8px}
label.c input{margin-top:5px;width:18px;height:18px;accent-color:var(--acc)}
.pr{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:8px}
.pr b{display:block;margin-bottom:2px}
.warn{background:var(--warn);border-radius:12px;padding:14px;margin-bottom:10px}
.my{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:8px}.my summary{font-weight:700;cursor:pointer}.my p{margin:10px 0 0}.seg{display:flex;gap:6px;margin-bottom:12px}.seg button{flex:1;padding:10px 4px;border:1px solid var(--line);border-radius:10px;background:var(--card);font-size:14px}.seg button[aria-pressed="true"]{background:var(--acc);color:var(--accfg);border-color:var(--acc);font-weight:700}a{color:var(--acc);font-weight:700}
button:focus-visible,a:focus-visible,textarea:focus-visible,input:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
</style>
</head>

고 심리 문제의 위험을 키운다는 점을 인정합니다. 동시에 책이 소개하는 연구자의 정리에 따르면, 이혼 가정의 아이 대다수는 초혼 가정의 아이와 다름없이 일상에 적응합니다. 적응 정도는 부모 사이의 갈등, 아이와 부모의 관계, 가정의 경제 형편, 따로 사는 부모와의 관계 같은 조건에 영향을 받는다고 합니다. 그래서 이혼 자체보다 이혼 뒤 부모가 어떻게 지내는지가 중요하다고 책은 봅니다.", "ask": "지금 내가 바꿀 수 있는 조건은 무엇인가?"}, {"title": "아이에게는 이혼을 최대한 늦게 알리는 게 낫다", "body": "책은 이 생각이 아이를 보호하려는 마음에서 나온다는 것을 이해합니다. 그러나 숨겼다가 나중에 알게 되면 아이는 충격과 함께 숨긴 부모에 대한 신뢰까지 잃는다고 봅니다. 아이에게는 자기 삶을 바꿀 큰 변화를 미리 받아들일 시간이 필요합니다. 부모가 이유와 앞으로의 계획을 설명하면 아이는 자신이 중요한 존재라는 확신을 얻고 불안을 덜 수 있다고 합니다.", "ask": "아이가 다른 사람에게 먼저 듣게 되면 어떤 마음일까?"}, {"title": "이혼의 이유를 사실대로 말하면 아이도 내 편이 된다", "body": "책은 아이가 묻고 싶은 것이 누구의 잘못인지가 아니라 가족이 왜 헤어지는지라고 봅니다. 한쪽을 가해자로 설명하면 아이와 다른 쪽 부모의 관계가 흔들리고, 어린 아이는 부모에 대한 비난을 자신에 대한 비난처럼 받아들인다고 합니다. 설령 사실이어도 책임을 따지는 방식은 피하라고 권합니다. 아이가 내 편을 드는 것은 내가 옳아서가 아니라 힘들어 보이는 부모를 걱정해서일 수 있습니다.", "ask": "내 설명은 아이를 안심시키는가, 아이에게 편을 고르게 하는가?"}, {"title": "법적으로 이혼했으니 이제 끝났다", "body": "책은 이혼에 법률적 이혼과 정서적 이혼이 있다고 봅니다. 법률적 이혼은 재산과 양육처럼 겉으로 드러난 문제를 정리하는 일이고, 진짜 문제는 마음이라고 합니다. 몇 해가 지나도 상대에 대한 감정이 복잡하다면 정서적 이혼이 아직 끝나지 않은 것입니다. 책은 미련, 집착, 습관이 옛 관계에 머물게 하는 흔한 이유라고 설명합니다.", "ask": "지금 내 마음은 어느 시점에 머물러 있는가?"}, {"title": "시간이 지나면 상처는 저절로 낫는다", "body": "책은 대충 잊히는 것과 회복은 다르다고 말합니다. 상처를 방치하면 그 감정이 결국 아이에게 전해지므로 시간에 맡겨 두지 말라고 합니다. 책이 꼽는 가장 좋은 처방은 지혜로운 자기 사랑입니다. 자신을 돌보면 고통을 이겨낼 힘이 생기고, 이후의 관계를 더 현명하게 이끌 수 있다고 봅니다.", "ask": "요즘 나를 돌보기 위해 한 일은 무엇인가?"}, {"title": "이혼은 인생의 실패다", "body": "책은 결혼이 깨진 것이 삶 전체의 실패는 아니라고 봅니다. 여러 과목을 보는 시험에서 한 과목을 망쳤다고 시험 전체를 포기하지 않는 것과 같다는 비유를 듭니다. 이혼은 치명상이 아니며 끝이 아니라 새로운 출발이라고 말합니다. 다만 책은 관계의 실패에 양쪽의 몫이 있다고 보는데, 폭력이나 학대가 있었다면 이 관점을 그대로 적용하지 말고 안전과 도움을 먼저 생각해야 합니다.", "ask": "이 일을 삶 전체의 평가로 키우고 있지는 않은가?"}, {"title": "용서하면 상대의 잘못이 없던 일이 된다", "body": "책은 용서가 화해가 아니라고 말합니다. 상대에게 갑자기 좋은 감정을 갖는 것도, 책임을 면해 주는 것도, 다시 믿는 것도 아닙니다. 용서는 내가 직접 벌주고 되갚겠다는 마음을 내려놓는 것입니다. 책은 이것이 결코 쉬운 일이 아니라고 인정하면서, 복수심은 결국 나 자신의 에너지를 먼저 소진시킨다고 봅니다.", "ask": "응징하고 싶은 마음이 내 하루의 얼마를 차지하고 있는가?"}, {"title": "이혼했으니 사람을 피하고 조용히 지내는 게 낫다", "body": "책은 이혼 과정에서 마음이 위축되면 사람을 피하게 되고, 그러면 고독해져 다시 사람을 피하게 되는 악순환이 생긴다고 봅니다. 그래서 이혼 직후에도 평소처럼 모임에 나가고 사람을 만나라고 권합니다. 자기 계발에 꼭 필요한 짧은 고독만 예외로 둡니다. 아이도 부모가 변화에 적응해 평소처럼 지내기를 바란다고 합니다.", "ask": "요즘 피하고 있는 만남은 무엇인가?"}, {"title": "아이가 내 편을 들어 주면 나를 이해한 것이다", "body": "책은 아이가 한쪽 부모의 편을 드는 것이 자기 이익 때문이 아니라 더 힘들어 보이는 부모를 걱정해서라고 봅니다. 아이가 어른의 비판에 진심으로 동의했다면 오히려 아이와 다른 부모의 관계에 금이 간 신호일 수 있다고 합니다. 편을 들지 않는다고 아이를 나무라서는 안 됩니다. 아이는 두 부모 모두의 편이라는 것이 책의 관점입니다.", "ask": "아이에게 어느 쪽도 고르지 않아도 된다고 말해 준 적이 있는가?"}, {"title": "칭찬을 많이 할수록 아이의 자존감이 올라간다", "body": "책은 칭찬이 자존감에 중요하지만 너무 잦으면 감동이 줄고 아이가 칭찬을 받으려고 조급해질 수 있다고 봅니다. 칭찬은 아이에 대한 평가이고, 격려는 용기를 북돋우는 일이라고 구분합니다. 그래서 습관적인 칭찬보다 아이를 믿고 지지하는 격려의 비중을 높이라고 권합니다. 아이가 실패했을 때는 배움의 과정이라고 설명해 주라고 합니다.", "ask": "오늘 내가 건넨 말은 평가였나, 격려였나?"}, {"title": "아이를 위해서라면 정답을 알려 주면 된다", "body": "책은 대화의 목적이 정답 찾기로 흐르면 오히려 대화가 되지 않는다고 봅니다. 아무리 좋은 말도 마음이 닫혀 있으면 들리지 않으므로 먼저 공감하고 마음을 열어야 합니다. 부모가 질문하고 끝까지 들어 주면 아이는 존중받는다고 느끼고 자기 생각을 표현하는 법을 배운다고 합니다. 조언은 아이가 도움을 원하는 때를 기다려 건네는 것이 좋다고 합니다.", "ask": "오늘 아이의 말을 끝까지 들은 적이 있는가?"}], "gains": [{"title": "다툼 없는 평온", "body": "책은 이혼 뒤 얻는 큰 변화로, 끊임없는 다툼과 말이 통하지 않는 상대와의 소모에서 벗어나는 것을 꼽습니다. 책 속 사례의 한 부모는 다툼 없는 조용한 가정이 평화롭다고 말합니다.", "line": "퇴근 후 현관을 열 때, 마음이 먼저 긴장하지 않는다."}, {"title": "나를 믿는 마음", "body": "이혼 뒤 집, 아이, 일 같은 문제를 하나씩 해결하며 스스로가 무기력한 사람이 아님을 확인했다는 사례가 책에 나옵니다. 책은 내 결정과 판단을 믿는 것만으로도 부정적인 감정이 약해진다고 봅니다.", "line": "아침 거울 앞에서, 오늘도 해 볼 수 있다고 스스로에게 말한다."}, {"title": "표현할 수 있는 마음", "body": "반응 없는 대화 속에서는 감정 표현이 줄었지만, 이혼 뒤 아이와 이야기하고 친구와 수다를 떨며 표현이 늘었다는 사례가 있습니다. 책은 자기감정을 솔직히 표현하는 사람이 건강하다고 봅니다.", "line": "힘든 날, 믿는 사람에게 “오늘 힘들었어”라고 말한다."}, {"title": "나를 위한 시간", "body": "바빠졌지만 운동과 배움에 시간을 쓰게 되었다는 사례가 책에 있습니다. 책은 가족을 돌보느라 자신을 돌보는 법을 잊은 사람에게, 의식적으로 나를 위한 시간을 내라고 권합니다.", "line": "주말 오후, 읽고 싶던 책을 들고 조용한 카페에 앉아 있다."}, {"title": "진솔한 사람들", "body": "책은 사람을 보는 눈이 달라졌다는 사례를 전합니다. 겉모습보다 내 말을 들어 주는 배려와 진솔함이 눈에 들어온다는 것입니다. 긍정적이고 진실한 사람들과 어울리면 자존감도 깨어난다고 봅니다.", "line": "카페에서 편한 친구와 나누는 한 시간이 더 소중해진다."}, {"title": "아이와의 깊은 대화", "body": "책은 일주일에 한 번은 아이와 마음을 나누는 시간을 가지라고 권합니다. 이 시간은 아이에게 도움이 될 뿐 아니라 부모에게도 용기가 된다고 합니다.", "line": "금요일 저녁, 아이가 먼저 학교 이야기를 꺼낸다."}, {"title": "스스로 세우는 생활의 틀", "body": "책은 경제적 안정, 좋은 양육 환경, 든든한 지원 그룹을 이혼 뒤 삶의 세 가지 틀로 봅니다. 단지 먹고살기 위한 일이 아니라, 나를 위해 진지하게 노력할 기회가 생겼다고 생각하라고 권합니다.", "line": "월말에 가계부를 덮으며, 다음 달 계획을 하나 세운다."}, {"title": "건강한 자존감", "body": "책은 자존감을 스스로 품위를 지키고 자신을 존중하는 마음으로 정의합니다. 자신의 장점을 적어 눈에 띄는 곳에 붙여 두고 자주 읽으면, 숨은 장점도 찾을 수 있다고 합니다.", "line": "냉장고에 붙인 쪽지를 보며, 나의 장점 하나를 소리 내어 읽는다."}, {"title": "아이의 신뢰", "body": "책은 말만 하고 실천하지 않는 어른의 말은 아이도 믿지 않는다고 봅니다. 정한 시간을 지키고 한 말을 실천하는 것이 부모와 아이가 신뢰를 쌓는 가장 중요한 규칙이라고 합니다.", "line": "약속한 시각에 현관에 서 있는 나를 아이가 본다."}, {"title": "새로운 시작", "body": "책은 이혼이 끝이 아니라 시작이라고 봅니다. 마음의 안정을 찾았다면 새로운 사람을 만날 준비도 된 것이라고 말합니다. 다만 새로운 인연이 생기면 아이의 마음을 세심하게 살피라고 당부합니다.", "line": "내년 여름, 아이와 함께 가고 싶었던 곳에 간다."}], "rules": [{"title": "과거의 부부는 내려놓고 아이의 부모로 산다", "body": "이혼은 부부 관계를 끝내는 일이고, 부모로서의 책임은 계속됩니다. 이 인식이 아이뿐 아니라 부모 자신이 새 삶을 준비하는 데도 필요하다고 책은 봅니다."}, {"title": "아이 앞에서 상대 부모를 존중한다", "body": "미워도 상대는 아이에게 하나뿐인 소중한 부모입니다. 비난과 험담은 아이에게 자신에 대한 비난처럼 닿습니다."}, {"title": "아이를 부모의 싸움에 끌어들이지 않는다", "body": "편들기를 요구하지 않고, 상대의 사생활을 알아 오게 하지 않고, 어른의 돈 문제를 전하게 하지 않고, 상대 부모에게 비밀을 지키게 하지 않습니다."}, {"title": "아이에게 부모를 고르게 하지 않는다", "body": "누구를 더 사랑하는지, 누가 잘못했는지, 누구와 살고 싶은지를 묻지 않습니다. 아이는 두 부모 모두의 편입니다."}, {"title": "이혼 소식은 부모가 함께, 먼저, 조용한 곳에서 전한다", "body": "아이가 다른 사람에게 먼저 듣지 않게 하고, 이혼의 원인이 아이가 아님을 이해할 때까지 반복해서 말합니다."}, {"title": "일주일에 한 번은 아이와 마음을 나눈다", "body": "좋아하는 음식을 함께 먹으며 학교생활과 감정을 이야기합니다. 정한 시간은 지킵니다."}, {"title": "정답보다 질문과 경청을 택한다", "body": "아이가 말할 때는 하던 일을 잠시 멈추고 집중합니다. 건성으로 하는 대화는 하지 않는 편이 낫다고 책은 봅니다."}, {"title": "칭찬보다 격려, 말보다 실천을 택한다", "body": "아이의 장점을 찾아 알려 주고 믿는다고 전합니다. 가르치고 싶은 교훈은 말이 아니라 부모의 생활로 보여 줍니다."}, {"title": "감정은 누르지 말고 표현한다", "body": "슬플 때는 애도하고, 화가 날 때는 안전한 방식으로 풀어냅니다. 우울한 감정이 깊고 오래가면 전문가의 상담을 받습니다."}, {"title": "생활의 틀을 세 가지로 세운다", "body": "경제적 안정, 좋은 양육 환경, 든든한 지원 그룹을 만듭니다. 도움을 청하는 것은 흠이 아니며, 단 한 사람의 지원군도 큰 힘이 된다고 합니다."}, {"title": "두 집 모두 아이의 집이 되게 한다", "body": "소지품과 공간을 양쪽에 마련하고, 아이의 체력과 일정을 고려해 만남을 조율합니다. 부모가 서로를 측은히 여기면 아이는 눈치 보지 않고 어느 부모든 편히 만날 수 있다고 합니다."}], "stories": [{"title": "휴대폰 문자에서 시작된 의심", "body": "한 사람이 배우자의 휴대폰에서 친밀한 말이 오간 문자를 보고 외도를 의심해 변호사를 찾은 사례입니다. 책은 구체적인 증거가 없어도 정황에 따라 소송이 가능하다는 변호사의 설명을 전합니다. 이혼은 감정의 일이면서 법적 절차가 필요한 일이기도 합니다. 개인 사정에 대한 법률 판단은 전문 상담을 받아야 합니다.", "line": "감정이 흔들릴수록, 절차는 전문가와 함께 확인한다."}, {"title": "다툼 뒤 물건을 부수는 배우자", "body": "다툼이 생길 때마다 배우자가 물건을 부수고 집을 나가는 일이 반복되어 몸을 다치기까지 한 사례입니다. 책은 폭력이 신체 폭행뿐 아니라 협박과 폭언까지 포함한다고 설명합니다. 자녀 걱정이나 경제적 독립에 대한 두려움 때문에 참고 사는 것은 위험하다며, 서둘러 법률 전문가를 만나 자신을 지키라고 조언합니다.", "line": "참고 견디는 것이 미덕이던 시대는 지났다고 책은 말한다."}, {"title": "고부 갈등과 닫힌 마음", "body": "배우자가 어머니의 말만 믿고 아내의 설명을 들으려 하지 않아 갈등이 깊어진 사례입니다. 책은 가장 바람직한 해결이 배우자와 솔직하게 대화하고 함께 대처하는 것이라고 봅니다. 이미 불신의 벽이 생겼다면 부부 상담처럼 제삼자의 도움이 필요하다고 합니다.", "line": "말이 통하지 않을 때는 제삼자의 도움을 청해도 된다."}, {"title": "도박 빚을 알게 된 날", "body": "배우자의 인터넷 도박과 빚을 알게 되고, 끊었다는 말도 믿기 어려워 두려워진 사례입니다. 책은 도박이 의지만으로 끊기 어려운 중독성을 가지므로 전문기관의 도움을 받으라고 조언합니다. 가정의 경제가 계속 어려워지면 혼인을 이어가기 어려운 사유가 될 수 있다고 설명합니다.", "line": "의지의 문제로만 보지 않고 전문가에게 연결한다."}, {"title": "이혼 사실을 숨긴 5년", "body": "이혼 전에 떼어 둔 서류를 해마다 직장에 내며 이혼 사실을 오래 숨긴 사람의 사례입니다. 자녀의 담임에게도 미리 뽑아 둔 서류를 내는 부모가 있다고 합니다. 책은 숨기면 아이를 학교와 함께 돌보기 어려워지므로, 필요한 사람에게는 알리고 도움을 청하는 편이 낫다고 봅니다.", "line": "숨기는 데 쓰는 힘을 아이를 돌보는 데 쓸 수 있다."}, {"title": "이혼 4년 뒤, 한 부모의 기록", "body": "이혼을 결심하기까지 오래 고민했고, 처음에는 혼자 양육할 수 있을지 두려웠다는 사람의 이야기입니다. 감정에 휘둘리던 시기를 지나 운동을 하고 아이와 여행을 계획하며 일상이 편안해졌다고 합니다. 책은 지금의 안정이 스스로 아픔을 지나온 결과라는 말과, 결정이 늦어진 시간이 아쉽다는 마음을 함께 전합니다.", "line": "지금의 평온은 하루하루 지나온 시간의 결과다."}, {"title": "부모의 다툼을 지켜본 어른이 된 자녀", "body": "어린 시절 부모의 잦은 다툼을 지켜본 한 성인 자녀가, 부모가 더 일찍 이혼했다면 다툼에서 일찍 벗어났을 것이라고 말하는 이야기입니다. 책은 이혼하지 않는 것이 최선이라고 보면서도, 어쩔 수 없이 선택한다면 이혼 뒤 분쟁을 멈추고 평온을 찾는 것이 갈등 속에서 지내는 것보다 아이에게 덜 해로울 수 있다고 말합니다. 이혼 여부는 여러 사정을 두고 신중하게 판단할 일입니다.", "line": "갈등이 이어지는 집의 아이도 상처를 받는다."}, {"title": "아이의 질문, 그 진짜 뜻", "body": "책은 아이가 대개 누구의 잘못인지 묻지 않고, 소중한 두 사람이 왜 떨어져 살아야 하는지, 다시 예전처럼 살 수 없는지를 묻는다고 봅니다. 부모가 이 질문을 책임 소재의 문제로 오해해 한쪽의 잘못을 설명하면 아이의 적응을 방해한다고 합니다. 아이가 이해해야 하는 이혼은 부부의 헤어짐이 아니라 가족의 헤어짐입니다.", "line": "아이가 묻는 것은 책임이 아니라 안심이다."}], "checklist": ["휴대폰을 치우고, 아이의 이야기를 들을 시간을 냈는가", "상대 부모를 탓하는 말이 섞여 있지 않은가", "정답을 말하기 전에 물어볼 질문 하나를 준비했는가", "내 감정이 격하다면, 대화를 잠시 미뤘는가"], "logEnabled": true, "help": {"disclaimer": "이 앱은 책의 관점을 정리한 것이며 법률, 의료, 심리 상담을 대신하지 않습니다. 책의 주장에는 논쟁의 여지가 있는 내용도 있으므로, 개인의 상황에서는 전문가와 상의하세요.", "signalsTitle": "이런 경우에는 전문가를 만나세요", "signals": ["배우자나 가족에게 폭행, 협박, 폭언을 겪었거나 겪을까 두려울 때 (위급하면 먼저 112)", "우울감이나 무기력이 깊고 오래가서 일상이 힘들 때", "삶을 끝내고 싶다는 생각이 들 때 (바로 109, 급박하면 112나 119)", "아이의 잠, 식사, 학교생활에 변화가 생기거나 불안과 분노가 오래 이어질 때", "아이가 상대 부모를 무서워하거나 맞았다고 말할 때", "양육권, 양육비, 재산분할처럼 법적 판단이 필요할 때", "도박이나 음주 같은 중독 문제가 가족의 생활을 흔들 때"], "contactsTitle": "연락처", "contacts": [{"label": "경찰 긴급신고", "value": "112", "tel": "112", "note": "폭력이나 신변의 위협 등 위급한 상황에서 바로 신고합니다."}, {"label": "여성긴급전화", "value": "1366", "tel": "1366", "note": "가정폭력 등으로 긴급한 상담과 보호가 필요할 때. 연중무휴 24시간 운영됩니다."}, {"label": "자살예방상담전화", "value": "109", "tel": "109", "note": "삶을 끝내고 싶다는 생각이 들 때 24시간 상담을 받을 수 있습니다."}, {"label": "정신건강위기상담전화", "value": "1577-0199", "tel": "1577-0199", "note": "우울, 불안 등 마음의 위기에 대해 24시간 상담을 받을 수 있습니다."}, {"label": "청소년상담전화", "value": "1388", "tel": "1388", "note": "청소년 자녀의 고민과 위기에 대해 상담을 받을 수 있습니다."}, {"label": "양육비이행관리원", "value": "1644-6621", "tel": "16446621", "note": "양육비 상담, 법률 지원 등을 안내합니다. 평일 9시부터 18시까지 운영됩니다."}, {"label": "대한법률구조공단", "value": "132", "tel": "132", "note": "법률 상담을 받을 수 있고, 조건에 따라 소송 지원도 안내합니다. 평일 운영됩니다."}, {"label": "한국가정법률상담소", "value": "1644-7077", "tel": "16447077", "note": "가족 문제에 대한 법률 상담을 받을 수 있습니다."}, {"label": "도박문제 헬프라인", "value": "1336", "tel": "1336", "note": "도박 문제를 겪는 당사자와 가족이 상담을 받을 수 있습니다. 연중무휴, 9시부터 22시까지 운영됩니다."}], "closing": "도움을 받는 것은 약해서가 아니라, 아이와 나를 지키는 가장 빠르고 안전한 방법입니다."}};

const L=Object.assign({today:"오늘",sos:"지금 대응",learn:"이해",story:"기록",help:"전문 도움",myths:"진실 확인",gains:"되찾는 것들",rules:"원칙",dailyLabel:"오늘의 선언",truthHeading:"오늘의 진실",pledgeHeading:"나의 결단문",pledgePlaceholder:"",checklistHeading:"사전 점검",checklistReset:"점검 초기화",sosLabel:"지금 대응",sosTitle:"",sosText:"",sosCta:"",sosFooter:"",back:"‹ 목록",bookHeading:"책의 관점",mindHeading:"마음속 선언",sayHeading:"그 자리에서 할 말",doHeading:"행동 지침",extraTag:"책 밖 조언",mythsTitle:"진실 확인",mythsIntro:"",askPrefix:"스스로에게 묻기: ",gainsTitle:"되찾는 것들",gainsIntro:"",rulesTitle:"핵심 원칙",rulesIntro:"",storyTitle:"사례",storyIntro:"",logTitle:"나의 기록",logIntro:"",logPlaceholder:"",logAdd:"기록하기",logDelete:"삭제",logCopy:"전체 복사",logCopied:"복사했습니다",logNote:"기록은 이 기기에만 저장되며 서버로 전송되지 않습니다.",helpTitle:"전문 도움"},C.labels||{});
const A=k=>Array.isArray(C[k])?C[k]:[];
const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const app=document.getElementById("app"),nav=document.getElementById("nav");
let tab="today",cur=null,sub=null;
function sg(k,d){try{const v=localStorage.getItem(k);return v===null?d:v}catch(e){return d}}
function ss(k,v){try{localStorage.setItem(k,v)}catch(e){}}
const day=()=>Math.floor(Date.now()/864e5);
const subs=()=>[["myths",L.mythsTitle],["gains",L.gainsTitle],["rules",L.rulesTitle]].filter(a=>A(a[0]).length);
const tabs=()=>[["today",L.today,"sun"],A("situations").length&&["sos",L.sos,"shield"],subs().length&&["learn",L.learn,"book"],(A("stories").length||C.logEnabled)&&["story",L.story,"note"],C.help&&["help",L.help,"buoy"]].filter(Boolean);
function today(){
 const d=day(),D=A("daily"),M=A("myths"),CK=A("checklist"),ck=JSON.parse(sg("ck","[]")),m=M.length?M[d%M.length]:null;
 return (D.length?`<div class="hero"><div class="lab">${esc(L.dailyLabel)}</div><p class="stmt">${esc(D[d%D.length])}</p></div>`:"")+
 (A("situations").length?`<button class="sit" data-go="sos"><span class="i">${ic("shield")}</span><span><b>${esc(L.sos)}</b><span class="mut">${esc(L.sosCta)}</span></span></button>`:"")+
 (m?`<h2>${esc(L.truthHeading)}</h2><div class="box"><b>${esc(m.title)}</b><p>${esc(m.body)}</p></div>`:"")+
 `<h2>${esc(L.pledgeHeading)}</h2><textarea id="pl" placeholder="${esc(L.pledgePlaceholder)}">${esc(sg("pl",""))}</textarea>`+
 (CK.length?`<h2>${esc(L.checklistHeading)}</h2>`+CK.map((c,n)=>`<label class="c"><input type="checkbox" data-c="${n}" ${ck.includes(n)?"checked":""}><span>${esc(c)}</span></label>`).join("")+`<button class="back" id="rs">${esc(L.checklistReset)}</button>`:"");
}
function sos(){
 const S=A("situations");
 if(cur===null)return `<div class="hero"><div class="lab">${esc(L.sosLabel)}</div><h1>${esc(L.sosTitle)}</h1><p>${esc(L.sosText)}</p></div>`+
  S.map((s,n)=>`<button class="sit" data-n="${n}"><span class="i">${ic(s.icon)}</span><span><b>${esc(s.title)}</b><span class="mut">${esc(s.sub)}</span></span></button>`).join("")+(L.sosFooter?`<p class="mut">${esc(L.sosFooter)}</p>`:"");
 const s=S[cur],say=s.say||[],dos=s.do||[];
 return `<button class="back" id="bk">${esc(L.back)}</button><h1>${esc(s.title)}</h1>`+
 (s.book?`<h2>${esc(L.bookHeading)}</h2><div class="box">${esc(s.book)}</div>`:"")+
 (s.mind?`<h2>${esc(L.mindHeading)}</h2><div class="mind">“${esc(s.mind)}”</div>`:"")+
 (say.length?`<h2>${esc(L.sayHeading)}</h2>`+say.map(x=>`<div class="say">“${esc(x)}”</div>`).join(""):"")+
 (dos.length?`<h2>${esc(L.doHeading)}</h2>${s.extra?`<span class="tag">${esc(L.extraTag)}</span>`:""}<ul class="l">${dos.map(x=>`<li>${esc(x)}</li>`).join("")}</ul>`:"");
}
function myths(){return `<h1>${esc(L.mythsTitle)}</h1><p class="mut">${esc(L.mythsIntro)}</p>`+A("myths").map(m=>`<details class="my"><summary>${esc(m.title)}</summary><p>${esc(m.body)}</p>${m.ask?`<p class="mind" style="font-size:17px">${esc(L.askPrefix)}${esc(m.ask)}</p>`:""}</details>`).join("")}
function gains(){return `<h1>${esc(L.gainsTitle)}</h1><p class="mut">${esc(L.gainsIntro)}</p>`+A("gains").map(g=>`<div class="box"><b>${esc(g.title)}</b><p>${esc(g.body)}</p>${g.line?`<div class="mind" style="font-size:16px;margin:0">“${esc(g.line)}”</div>`:""}</div>`).join("")}
function rules(){return `<h1>${esc(L.rulesTitle)}</h1><p class="mut">${esc(L.rulesIntro)}</p>`+A("rules").map((p,n)=>`<div class="pr"><b>${n+1}. ${esc(p.title)}</b>${esc(p.body)}</div>`).join("")}
function learn(){
 const S=subs();if(!S.some(a=>a[0]===sub))sub=S[0][0];
 return (S.length>1?`<div class="seg">`+S.map(a=>`<button data-s="${a[0]}" aria-pressed="${sub===a[0]}">${esc(a[1])}</button>`).join("")+`</div>`:"")+{myths,gains,rules}[sub]();
}
function story(){
 const log=JSON.parse(sg("log","[]")),E=A("stories");
 return (E.length?`<h1>${esc(L.storyTitle)}</h1><p class="mut">${esc(L.storyIntro)}</p>`+E.map(e=>`<details class="my"><summary>${esc(e.title)}</summary><p>${esc(e.body)}</p>${e.line?`<p class="mind" style="font-size:17px">${esc(e.line)}</p>`:""}</details>`).join(""):"")+
 (C.logEnabled?`<h2>${esc(L.logTitle)}</h2><p class="mut">${esc(L.logIntro)}</p>
 <textarea id="ex" placeholder="${esc(L.logPlaceholder)}"></textarea>
 <button class="sit" id="ad" style="justify-content:center;margin-top:8px"><b>${esc(L.logAdd)}</b></button>`+
 log.map((l,n)=>`<div class="box"><span class="mut">${esc(l.d)}</span><p>${esc(l.t)}</p><button class="back" data-del="${n}">${esc(L.logDelete)}</button></div>`).join("")+
 (log.length?`<button class="back" id="cp">${esc(L.logCopy)}</button>`:"")+`<p class="mut">${esc(L.logNote)}</p>`:"");
}
function help(){
 const H=C.help||{};
 return `<h1>${esc(L.helpTitle)}</h1>`+(H.disclaimer?`<div class="warn"><b>${esc(H.disclaimer)}</b></div>`:"")+
 ((H.signals||[]).length?`<h2>${esc(H.signalsTitle||"")}</h2><ul class="l">${H.signals.map(x=>`<li>${esc(x)}</li>`).join("")}</ul>`:"")+
 ((H.contacts||[]).length?`<h2>${esc(H.contactsTitle||"")}</h2>`+H.contacts.map(c=>`<div class="box">${esc(c.label)} ${c.tel?`<a href="tel:${esc(c.tel)}">${esc(c.value)}</a>`:esc(c.value)}${c.note?`<br><span class="mut">${esc(c.note)}</span>`:""}</div>`).join(""):"")+
 (H.closing?`<p class="mut">${esc(H.closing)}</p>`:"");
}
function go(t){tab=t;cur=null;render();scrollTo(0,0)}
function render(){
 if(!tabs().some(a=>a[0]===tab))tab="today";
 app.innerHTML={today,sos,learn,story,help}[tab]();
 nav.innerHTML=tabs().map(a=>`<button data-t="${a[0]}" aria-current="${tab===a[0]}">${ic(a[2],22)}<span>${esc(a[1])}</span></button>`).join("");
 const q=(s,f)=>app.querySelectorAll(s).forEach(f);
 const bk=document.getElementById("bk");if(bk)bk.onclick=()=>{cur=null;render();scrollTo(0,0)};
 q(".sit[data-n]",b=>b.onclick=()=>{cur=+b.dataset.n;render();scrollTo(0,0)});
 q("[data-go]",b=>b.onclick=()=>go(b.dataset.go));
 nav.querySelectorAll("button").forEach(b=>b.onclick=()=>go(b.dataset.t));
 q("[data-s]",b=>b.onclick=()=>{sub=b.dataset.s;render()});
 const pl=document.getElementById("pl");if(pl)pl.oninput=()=>ss("pl",pl.value);
 q("input[data-c]",i=>i.onchange=()=>{ss("ck",JSON.stringify([...app.querySelectorAll("input[data-c]")].filter(x=>x.checked).map(x=>+x.dataset.c)))});
 const rs=document.getElementById("rs");if(rs)rs.onclick=()=>{ss("ck","[]");render()};
 const ad=document.getElementById("ad");if(ad)ad.onclick=()=>{const v=document.getElementById("ex").value.trim();if(!v)return;const l=JSON.parse(sg("log","[]"));l.unshift({d:new Date().toLocaleDateString(document.documentElement.lang||"ko"),t:v});ss("log",JSON.stringify(l));render()};
 q("[data-del]",b=>b.onclick=()=>{const l=JSON.parse(sg("log","[]"));l.splice(+b.dataset.del,1);ss("log",JSON.stringify(l));render()});
 const cp=document.getElementById("cp");if(cp)cp.onclick=()=>{const l=JSON.parse(sg("log","[]"));try{navigator.clipboard.writeText(l.map(x=>x.d+"\n"+x.t).join("\n\n")).then(()=>{cp.textContent=L.logCopied})}catch(e){}};
}
render();
// 서비스 워커 등록 (오프라인 사용). https 또는 localhost에서만 동작합니다.
if("serviceWorker" in navigator){window.addEventListener("load",()=>{navigator.serviceWorker.register("sw.js").catch(()=>{})})}
</script>
</body>
</html>
